services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /data/eqip.sqlite
    volumes:
      - eqip-data:/data
    ports:
      - "127.0.0.1:3000:3000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
volumes:
  eqip-data:
